name: Deploy Guidedrun To Pages

on:
  push:
    branches: [Guidedrun]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ReferenceProject1/docs/package-lock.json

      - name: Install dependencies
        working-directory: ReferenceProject1/docs
        run: npm ci

      - name: Build static site for Pages
        working-directory: ReferenceProject1/docs
        run: npm run build

      - name: Add .nojekyll marker
        run: New-Item -Path "ReferenceProject1/docs/dist/.nojekyll" -ItemType File -Force
        shell: pwsh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ReferenceProject1/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
